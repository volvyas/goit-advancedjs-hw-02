  <body>
    <div class="container">
      <form class="form">
        <label>
          Delay (ms)
          <input
            type="number"
            name="delay"
            required
            style="display: block"
            step="50"
            min="0"
          />
        </label>

        <fieldset>
          <legend>State</legend>
          <label>
            <input type="radio" name="state" value="fulfilled" required />
            Fulfilled
          </label>
          <label>
            <input type="radio" name="state" value="rejected" required />
            Rejected
          </label>
        </fieldset>

        <button id="submit-btn" type="submit">Create notification</button>
      </form>
    </div>
